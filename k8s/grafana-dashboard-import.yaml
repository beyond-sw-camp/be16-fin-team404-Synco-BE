apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-overview.json: |
    {
      "title": "Kubernetes Cluster Overview",
      "tags": ["kubernetes", "nodes", "pods"],
      "timezone": "browser",
      "schemaVersion": 27,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "default"},
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "default"},
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Cluster CPU Usage",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"$node\"}[5m])) * 100)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": 0, "color": "green"},
                  {"value": 70, "color": "yellow"},
                  {"value": 90, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Cluster Memory Usage",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "(1 - (sum(node_memory_MemAvailable_bytes{instance=~\"$node\"}) / sum(node_memory_MemTotal_bytes{instance=~\"$node\"}))) * 100",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": 0, "color": "green"},
                  {"value": 70, "color": "yellow"},
                  {"value": 90, "color": "red"}
                ]
              }
            }
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          }
        },
        {
          "id": 3,
          "title": "Total Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 3, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=~\"$namespace\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 4,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 3, "x": 15, "y": 0},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{phase=\"Running\",namespace=~\"$namespace\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 5,
          "title": "Node CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"$node\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {"drawStyle": "line", "lineInterpolation": "smooth"}
            }
          }
        },
        {
          "id": 6,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes{instance=~\"$node\"} / node_memory_MemTotal_bytes{instance=~\"$node\"})) * 100",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {"drawStyle": "line", "lineInterpolation": "smooth"}
            }
          }
        },
        {
          "id": 7,
          "title": "Pod CPU Usage",
          "type": "table",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod!=\"\",container!=\"POD\"}[5m])) by (namespace, pod, instance)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "displayMode": "table",
                "inspect": false
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {"type": "colored-background"}
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {"value": 0, "color": "green"},
                        {"value": 0.5, "color": "yellow"},
                        {"value": 1.0, "color": "red"}
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          }
        },
        {
          "id": 8,
          "title": "Pod Memory Usage",
          "type": "table",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\",pod!=\"\",container!=\"POD\"}) by (namespace, pod, instance)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "displayMode": "table",
                "inspect": false
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {"type": "colored-background"}
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          }
        },
        {
          "id": 9,
          "title": "Pod Status",
          "type": "table",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 22},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "count by (namespace, pod, phase) (kube_pod_status_phase{namespace=~\"$namespace\"})",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "displayMode": "table",
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "Running": {"text": "Running", "color": "green"},
                    "Pending": {"text": "Pending", "color": "yellow"},
                    "Failed": {"text": "Failed", "color": "red"},
                    "Succeeded": {"text": "Succeeded", "color": "blue"},
                    "Unknown": {"text": "Unknown", "color": "gray"}
                  },
                  "type": "value"
                }
              ]
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "phase"},
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {"type": "colored-text"}
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 10,
          "title": "Pod Restarts",
          "type": "table",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 22},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) by (namespace, pod)",
              "format": "table",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "displayMode": "table",
                "inspect": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"value": 0, "color": "green"},
                  {"value": 1, "color": "yellow"},
                  {"value": 5, "color": "red"}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Value"},
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {"type": "colored-background"}
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          }
        },
        {
          "id": 11,
          "title": "Pods per Node",
          "type": "bargauge",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 22},
          "datasource": {"type": "prometheus", "uid": "default"},
          "targets": [
            {
              "expr": "count by (node) (kube_pod_info{namespace=~\"$namespace\"})",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "displayMode": "gradient",
                "orientation": "horizontal"
              },
              "color": {"mode": "palette-classic"}
            }
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true
          }
        }
      ]
    }
