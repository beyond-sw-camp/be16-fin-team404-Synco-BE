  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: password
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

spring.data.elasticsearch:
  repositories:
    enabled: true

