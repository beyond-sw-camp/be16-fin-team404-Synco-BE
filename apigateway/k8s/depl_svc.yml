apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-depl
  namespace: synco-namespace
spec:
  replicas: 1
  # 아래의 label은 replicaset이 관리해야 할 파드를 결정하는데 사용
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
    # 아래의 labels는 service의 selector.app과 일치해야함
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway-container # 이름 의미없음.
        image: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com/synco-namespace/apigateway:latest
        ports: 
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할 수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될때 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        # JWT 설정
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: JWT_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: synco-namespace
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: apigateway