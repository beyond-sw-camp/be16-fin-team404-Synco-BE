server:
  port: 8080

eureka:
  client:
    enabled: false

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
            - 'https://www.synco1.shop'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
      routes:
        - id: chat-service
          predicates:
            - Path=/chat-service/**
          filters:
            - StripPrefix=1
          uri: http://chat-service:80
        - id: drive-service
          predicates:
            - Path=/drive-service/**
          filters:
            - StripPrefix=1
          uri: http://drive-service:80
        - id: task-service
          predicates:
            - Path=/task-service/**
          filters:
            - StripPrefix=1
          uri: http://task-service:80
        - id: workspace-service
          predicates:
            - Path=/workspace-service/**
          filters:
            - StripPrefix=1
          uri: http://workspace-service:80
        - id: search-service
          predicates:
            - Path=/search-service/**
          filters:
            - StripPrefix=1
          uri: http://search-service:80
        - id: livekit-webhook
          predicates:
            - Path=/livekit/**
          uri: http://task-service:80

jwt:
  secretKey : ${JWT_SECRET_KEY}
