server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - 'http://localhost:3000'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowedCredentials: true
      routes:
        - id: chat-service
          predicates:
            - Path=/chat-service/**
          filters:
            - StripPrefix=1
          uri: lb://chat-service
        - id: drive-service
          predicates:
            - Path=/drive-service/**
          filters:
            - StripPrefix=1
          uri: lb://drive-service
        - id: task-service
          predicates:
            - Path=/task-service/**
          filters:
            - StripPrefix=1
          uri: lb://task-service
        - id: workspace-service
          predicates:
            - Path=/workspace-service/**
          filters:
            - StripPrefix=1
          uri: lb://workspace-service

