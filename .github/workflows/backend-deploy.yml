name: deploy synco-backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v2
      
      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.25.9"
        id: install
        
      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ap-northeast-2

      - name: update cluster information
        run: aws eks update-kubeconfig --region ap-northeast-2 --name synco-cluster

      # AI Service (Python)
      - name: Login to ECR
        id: login-ecr-ai
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push ai-service docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/ai-service
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./ai-service/Dockerfile ./ai-service
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply ai-service
        run: |
          kubectl apply -f ./ai-service/k8s/depl_svc.yml
          kubectl rollout restart deployment ai-service-depl -n synco-namespace

      # API Gateway
      - name: Login to ECR
        id: login-ecr-apigateway
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push apigateway docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/apigateway
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./apigateway
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply apigateway
        run: |
          kubectl apply -f ./apigateway/k8s/depl_svc.yml
          kubectl rollout restart deployment apigateway-depl -n synco-namespace

      # Chat Service
      - name: Login to ECR
        id: login-ecr-chat
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push chat docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/chat
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./chat
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply chat
        run: |
          kubectl apply -f ./chat/k8s/depl_svc.yml
          kubectl rollout restart deployment chat-depl -n synco-namespace

      # Drive Service
      - name: Login to ECR
        id: login-ecr-drive
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push drive docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/drive
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./drive
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply drive
        run: |
          kubectl apply -f ./drive/k8s/depl_svc.yml
          kubectl rollout restart deployment drive-depl -n synco-namespace

      # Search Service
      - name: Login to ECR
        id: login-ecr-search
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push search docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/search
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./search
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply search
        run: |
          kubectl apply -f ./search/k8s/depl_svc.yml
          kubectl rollout restart deployment search-depl -n synco-namespace

      # Task Service
      - name: Login to ECR
        id: login-ecr-task
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push task docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/task
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./task
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply task
        run: |
          kubectl apply -f ./task/k8s/depl_svc.yml
          kubectl rollout restart deployment task-depl -n synco-namespace

      # Workspace Service
      - name: Login to ECR
        id: login-ecr-workspace
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push workspace docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/workspace
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./Dockerfile ./workspace
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply workspace
        run: |
          kubectl apply -f ./workspace/k8s/depl_svc.yml
          kubectl rollout restart deployment workspace-depl -n synco-namespace
