name: deploy synco-backend

on:
  push:
    branches:
      - deploy-branch
    paths:
      - 'ai-service/**'
      - 'apigateway/**'
      - 'chat/**'
      - 'drive/**'
      - 'search/**'
      - 'task/**'
      - 'workspace/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  # 변경된 서비스 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      apigateway: ${{ steps.filter.outputs.apigateway }}
      chat: ${{ steps.filter.outputs.chat }}
      drive: ${{ steps.filter.outputs.drive }}
      search: ${{ steps.filter.outputs.search }}
      task: ${{ steps.filter.outputs.task }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            ai-service:
              - 'ai-service/**'
            apigateway:
              - 'apigateway/**'
            chat:
              - 'chat/**'
            drive:
              - 'drive/**'
            search:
              - 'search/**'
            task:
              - 'task/**'
            workspace:
              - 'workspace/**'

  # 공통 설정 (AWS, kubectl)
  setup:
    runs-on: ubuntu-latest
    outputs:
      registry: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
    steps:
      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ap-northeast-2

      - name: update cluster information
        run: aws eks update-kubeconfig --region ap-northeast-2 --name synco-cluster

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.25.9"

  # AI Service (Python)
  deploy-ai-service:
    needs: [detect-changes, setup]
    if: needs.detect-changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v3

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ap-northeast-2

      - name: update cluster information
        run: aws eks update-kubeconfig --region ap-northeast-2 --name synco-cluster

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.25.9"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: build and push ai-service docker image to ecr
        env:
          REGISTRY: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: synco-namespace/ai-service
          IMAGE_TAG: latest
        run: |
          docker build \
          -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
          -f ./ai-service/Dockerfile ./ai-service
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: eks kubectl apply ai-service
        run: |
          kubectl apply -f ./ai-service/k8s/depl_svc.yml
          kubectl rollout restart deployment ai-service-depl -n synco-namespace

  # API Gateway
  deploy-apigateway:
