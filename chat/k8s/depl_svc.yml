apiVersion: apps/v1
kind: Deployment
metadata: 
  name: chat-depl
  namespace: synco-namespace
spec:
  replicas: 1
  # 아래의 label은 replicaset이 관리해야 할 파드를 결정하는데 사용
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
    # 아래의 labels는 service의 selector.app과 일치해야함
      labels:
        app: chat
    spec:
      containers:
      - name: chat-container
        image: 864981729633.dkr.ecr.ap-northeast-2.amazonaws.com/synco-namespace/chat:latest
        ports: 
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할 수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될때 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        # 아래의 name과 yml의 ${}의 변수명과 일치해야함.
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: DB_PW
        # AWS 설정 (S3 접근용)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: AWS_SECRET_ACCESS_KEY
        # JWT 설정
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: synco-secrets
              key: JWT_SECRET_KEY
        # 컨테이너 상태 확인을 통해 롤링업데이트 최적화 
        readinessProbe:
          httpGet:
            # healthcheck 경로 (HealthCheckController: /chat/health)
            path: /chat/health
            port: 8080
          # 컨테이너 시작 후 지연
          initialDelaySeconds: 10
          # 확인 반복 주기
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: synco-namespace
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: chat